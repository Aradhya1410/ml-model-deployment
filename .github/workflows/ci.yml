# .github/workflows/ci.yml
#
# This is our CI/CD pipeline. GitHub automatically runs this file
# every time you push code or open a pull request.
#
# What it does, in plain English:
#   1. Gets a clean Ubuntu machine from GitHub.
#   2. Downloads (checks out) our repo's code onto it.
#   3. Installs Python.
#   4. Installs our project's dependencies.
#   5. Trains the model (so model.pkl exists for tests).
#   6. Runs our automated tests.
#   7. If tests pass, builds the Docker image to prove it builds cleanly.
#
# If any step fails, the whole workflow fails and GitHub shows a red X
# on your commit/PR — this is exactly what "CI" (Continuous Integration) means.

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train model
        run: python model/train_model.py

      - name: Run tests
        run: pytest -v

      - name: Build Docker image
        run: docker build -t ml-model-deployment:ci .
