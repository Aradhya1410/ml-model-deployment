# prometheus.yml
#
# Tells Prometheus: "every 5 seconds, go fetch metrics from this target."
# Prometheus works by PULLING metrics from apps, not apps pushing to it.

global:
  scrape_interval: 5s      # How often Prometheus scrapes targets

scrape_configs:
  - job_name: "ml-api"
    static_configs:
      # "api" is the service name from docker-compose.yml.
      # Docker's internal DNS resolves "api" to the api container's IP
      # automatically, because both containers are on the same
      # docker-compose network (ml-network).
      - targets: ["api:8000"]
